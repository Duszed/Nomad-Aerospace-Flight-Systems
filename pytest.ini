[pytest]
# One command from the repo root runs everything:
#   telemetry/   the original 50 tests + tests for the telemetry extensions
#   tests/atlas/ Nomad Atlas
testpaths = telemetry tests
pythonpath = . telemetry
filterwarnings =
    ignore::DeprecationWarning:pymavlink.*
    ignore:Using .httpx. with .starlette.testclient.
