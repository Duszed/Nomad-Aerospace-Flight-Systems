; Nomad Aerospace - Field Telemetry Node Build Environment
; MCU: ESP32-C6 (RISC-V, 802.15.4 capable) - see SPECS.md
; NOTE: !!!this file must be named exactly "platformio.ini" in the project!!!
; root (no trailing characters) or PlatformIO will not detect it.
;

[env:esp32-c6-devkitc-1]
platform = espressif32
board = esp32-c6-devkitc-1
framework = arduino
monitor_speed = 115200

lib_deps =
    adafruit/Adafruit SHT4x Library @ ^1.0.4
    adafruit/Adafruit BusIO @ ^1.14.1
