; Nomad Aerospace - Telemetry Node Build Environment
; Architecture: ESP32-C3 (RISC-V)
; Build Engine: PlatformIO

[env:esp32-c3-devkitm-1]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200

; Cloud Dependency Manager
; These libraries are automatically fetched during the build process
lib_deps =
    adafruit/Adafruit SHT4x Library @ ^1.0.4
    adafruit/Adafruit BusIO @ ^1.14.1
